<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hustle Empire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="default">

<div id="ticker" class="ticker"><div id="tickerText" class="ticker-text"></div></div>

<header class="top">
  <div class="brand">
    <span id="flag" class="flag">🌍</span>
    <div>
      <input id="companyName" maxlength="28" aria-label="Company name" value="My Company">
      <div id="rebirthInfo" class="muted small"></div>
    </div>
  </div>
  <div class="wallet">
    <div id="cash" class="cash">$0</div>
    <div id="ips" class="muted">$0 / sec</div>
  </div>
</header>

<div id="events" class="events" aria-live="polite"></div>

<main>
  <section id="home">
    <h2>Home</h2>
    <div class="hustle-wrap">
      <button id="hustle" class="hustle">HUSTLE<small id="clickVal">+$1</small></button>
    </div>
    <div class="panel">
      <h3>Go public</h3>
      <p id="ipoText" class="muted"></p>
      <button id="ipoBtn" class="btn">IPO on Nasdaq</button>
    </div>
    <div class="panel">
      <h3>Start your next company</h3>
      <p id="rebirthText" class="muted"></p>
      <button id="rebirthBtn" class="btn">Start Your Next Company</button>
    </div>
    <div class="panel">
      <h3>Country Point shop <span id="cpBal" class="chip"></span></h3>
      <div id="shop"></div>
    </div>
  </section>

  <section id="portfolio">
    <h2>Portfolio</h2>
    <div class="bulk" id="bizBulk"></div>
    <div id="bizList"></div>
  </section>

  <section id="upgrades">
    <h2>Upgrades</h2>
    <div id="upgList"></div>
  </section>

  <section id="expansion">
    <h2>Expansion</h2>
    <div id="expList"></div>
    <h3>Security contracts</h3>
    <div id="secList"></div>
    <h3>Insurance fund</h3>
    <div id="insList"></div>
  </section>

  <section id="stocks">
    <h2>Stocks</h2>
    <div class="bulk" id="stockBulk"></div>
    <div id="stockList"></div>
  </section>

  <section id="affairs">
    <h2>Affairs</h2>
    <div class="panel">
      <h3>World map: outreach</h3>
      <div id="continents" class="continents"></div>
      <div class="row">
        <select id="countrySel" aria-label="Country"></select>
        <button id="reachOut" class="btn">Reach Out</button>
      </div>
    </div>
    <h3>World affairs dashboard</h3>
    <div id="dash"></div>
  </section>

  <section id="options">
    <h2>Options</h2>
    <div class="panel opts">
      <label>Theme
        <select id="optTheme">
          <option value="default">Default</option><option value="midnight">Midnight</option>
          <option value="light">Light</option><option value="forest">Forest</option><option value="sunset">Sunset</option>
        </select>
      </label>
      <label><input type="checkbox" id="optMotion"> Reduced motion</label>
      <label><input type="checkbox" id="optTicker"> Ticker animation</label>
      <label><input type="checkbox" id="optTickerShow"> Show news ticker</label>
      <label><input type="checkbox" id="optSound"> Sound effects</label>
      <label><input type="checkbox" id="optCompact"> Compact mode</label>
      <label><input type="checkbox" id="optConfRebirth"> Confirm before rebirth</label>
      <label><input type="checkbox" id="optConfReset"> Confirm before reset</label>
      <div class="row">
        <button id="optDefaults" class="btn ghost">Reset settings</button>
        <button id="saveNow" class="btn ghost">Save now</button>
        <button id="hardReset" class="btn danger">Reset all progress</button>
      </div>
    </div>
  </section>
</main>

<nav class="bottom" id="nav">
  <a href="#home">🏠<span>Home</span></a>
  <a href="#portfolio">💼<span>Portfolio</span></a>
  <a href="#upgrades">⬆️<span>Upgrades</span></a>
  <a href="#expansion">🌍<span>Expansion</span></a>
  <a href="#stocks">📈<span>Stocks</span></a>
  <a href="#affairs">🤝<span>Affairs</span></a>
  <a href="#options">⚙<span>Options</span></a>
</nav>

<div id="modal" class="modal hidden"><div id="modalBody" class="modal-body"></div></div>
<div id="toasts" class="toasts"></div>

<script src="game.js"></script>
</body>
</html>
